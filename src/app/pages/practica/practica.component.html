<div class="filtros">
  <label>
    Escuela Profesional:
    <select disabled>
      <option>Selecciona E.P.</option>
    </select>
  </label>

  <label>
    Semestre:
    <input type="text" placeholder="2025-2" disabled />
  </label>

  <label>
    Ciclo:
    <input type="text" placeholder="1 ciclo" disabled />
  </label>

  <button>Aplicar búsqueda</button>
</div>

<div class="tabs">
  <button class="active">Practicantes</button>
  <button disabled>Horas</button>
</div>

<!-- Mostrar tabla solo si terminó de cargar Y hay estudiantes -->
<div class="table-wrapper" *ngIf="!loading && students.length > 0">
  <table>
    <thead>
      <tr>
        <th>N°</th>
        <th>Nombre del practicante</th>
        <th>Código</th>
        <th>Escuela Profesional</th>
        <th>Horas Asignadas</th>
        <th>Horas Registradas</th>
        <th>Ciclo</th>
        <th>Semestre</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let student of paginatedStudents; let i = index">
        <td>{{ (currentPage - 1) * itemsPerPage + i + 1 }}</td>
        <td>{{ student.nombre_completo }}</td>
        <td>{{ student.codigo }}</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td>
          <span [ngClass]="{
            'estado-habilitado': student.estado_practica === 'Habilitado',
            'estado-inhabilitado': student.estado_practica === 'Deshabilitado'
          }">
            {{ student.estado_practica }}
          </span>
        </td>
        <td>
          <button class="edit-btn">Editar Estado</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Paginador compacto -->
  <div class="paginador-circular" *ngIf="totalPages > 1">
    <button (click)="changePage(1)" [disabled]="currentPage === 1">«</button>
    <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">‹</button>

    <ng-container *ngIf="currentPage > 2">
      <button (click)="changePage(1)">1</button>
      <span *ngIf="currentPage > 3">...</span>
    </ng-container>

    <button *ngFor="let page of visiblePages" [class.active]="page === currentPage" (click)="changePage(page)">
      {{ page }}
    </button>

    <ng-container *ngIf="currentPage < totalPages - 1">
      <span *ngIf="currentPage < totalPages - 2">...</span>
      <button (click)="changePage(totalPages)">{{ totalPages }}</button>
    </ng-container>

    <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">›</button>
    <button (click)="changePage(totalPages)" [disabled]="currentPage === totalPages">»</button>
  </div>
</div>

<!-- Mensaje si no hay resultados -->
<div *ngIf="!loading && students.length === 0">
  <p>No hay datos disponibles.</p>
</div>
